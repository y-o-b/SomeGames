<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4B8ED8" />
  <meta name="description" content="Detektor: Finde Minen auf Quadraten oder Sechsecken, markiere falsche Flaggen und folge dem Metalldetektor." />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="application-name" content="Spiele" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Spiele" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="icon" href="icons/minesweeper.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/minesweeper-180.png" />
  <title>Detektor</title>
  <style>
    /* Spiele: kein Markieren von Text, auch kein Lupen- oder Kopiermenü beim langen Drücken; Eingabefelder ausgenommen. */
    html { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    input, textarea { -webkit-user-select: text; user-select: text; }
    :root { --bg: #4B8ED8; --panel: #FFFFFF; --text: #171717; --muted: rgba(23,23,23,.7); --red: #EF4B3F; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px 15px; display: grid; justify-items: center; align-content: start; color: var(--text); background: var(--bg); font: 16px/1.5 Arial, Helvetica, sans-serif; }
    .app { width: min(100%, 620px); }
    /* Das Spielfeld füllt die normale Browser-Ansicht; Status und Aktionen liegen einzeln darüber. */
    body.board-view-mode { height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; padding: 0; display: block; }
    body.board-view-mode .app { width: 100%; height: 100vh; height: 100dvh; min-height: 0; margin: 0; overflow: hidden; background: var(--bg); }
    body.board-view-mode header { position: fixed; z-index: 3; top: max(8px, env(safe-area-inset-top)); left: 0; width: 100%; height: 48px; margin: 0; padding: 0 64px; pointer-events: none; }
    body.board-view-mode header h1 { font-size: clamp(1.65rem, 6vw, 2.4rem); }
    body.board-view-mode .back-button { pointer-events: auto; }
    body.board-view-mode .back-button { left: max(10px, env(safe-area-inset-left)); }
    body.board-view-mode .version { display: none; }
    body.board-view-mode .settings-dialog .version { display: block; }
    body.board-view-mode .game { padding: 0; border: 0; border-radius: 0; box-shadow: none; background: transparent; }
    body.board-view-mode .game.wrap-mode .board.wrap { position: fixed; z-index: 1; inset: 0; width: 100%; height: 100%; max-width: none; margin: 0; border: 0; border-radius: 0; aspect-ratio: auto; }
    body.board-view-mode .game .stats { display: grid; position: fixed; z-index: 3; top: max(64px, calc(env(safe-area-inset-top) + 58px)); left: 50%; width: min(calc(100% - 24px), 460px); padding: 4px; margin: 0; border: 2px solid #171717; border-radius: 12px; background: rgba(255,255,255,.92); box-shadow: 3px 3px 0 #171717; transform: translateX(-50%); gap: 2px; }
    body.board-view-mode .game .stat { padding: 3px 2px; border: 0; background: transparent; }
    body.board-view-mode .game .stat strong { font-size: 1rem; }
    body.board-view-mode .game .stat span { font-size: .62rem; }
    body.board-view-mode .game .stats .message:empty { display: none; }
    body.board-view-mode .game .stats .message { display: block; grid-column: 1 / -1; min-height: 0; margin: 2px 4px 0; padding-top: 4px; border-top: 1px solid rgba(23,23,23,.2); font-size: .72rem; line-height: 1.25; }
    body.board-view-mode .game .board-tools { display: block; }
    body.board-view-mode .game .new-game { display: block; position: fixed; z-index: 4; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); width: min(calc(100% - 32px), 240px); margin: 0; transform: translateX(-50%); }
    body.board-view-mode .game .hint-button { display: none; }
    body.board-view-mode .overlay-hint { display: grid; top: calc(max(8px, env(safe-area-inset-top)) + 2px); bottom: auto; width: 44px; height: 44px; right: max(10px, env(safe-area-inset-right)); }
    body.board-view-mode .game.finished .new-game { top: 50%; bottom: auto; width: min(calc(100% - 32px), 300px); transform: translate(-50%, -50%); }
    body.board-view-mode .game.finished .overlay-hint { display: none; }
    .overlay-corner { display: none; place-items: center; position: fixed; z-index: 2; top: max(64px, calc(env(safe-area-inset-top) + 58px)); width: 48px; height: 48px; padding: 0; border: 3px solid #171717; border-radius: 50%; color: #171717; background: #FFFFFF; box-shadow: 3px 3px 0 #171717; font-size: 1.35rem; line-height: 1; -webkit-tap-highlight-color: transparent; transition: transform .12s, box-shadow .12s; }
    .overlay-corner:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #171717; }
    .overlay-corner:focus-visible { outline: 3px solid #EF4B3F; outline-offset: 3px; }
    .overlay-corner svg { display: block; width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .overlay-hint { right: max(10px, env(safe-area-inset-right)); background: #FFD166; }
    body.board-view-mode .overlay-corner { display: grid; }
    .back-button { display: grid; place-items: center; width: 44px; height: 44px; position: absolute; left: 0; top: 50%; margin-top: -22px; border: 3px solid #171717; border-radius: 50%; color: #171717; background: #FFFFFF; box-shadow: 3px 3px 0 #171717; text-decoration: none; -webkit-tap-highlight-color: transparent; transition: transform .12s, box-shadow .12s; }
    .back-button svg { display: block; width: 24px; height: 24px; margin-right: 2px; fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    .back-button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #171717; }
    .back-button:focus-visible { outline: 3px solid #EF4B3F; outline-offset: 3px; }
    .version { display: block; margin: 14px auto 0; padding: 0; border: 0; color: var(--muted); background: transparent; font: inherit; font-size: .72rem; cursor: pointer; }
    header { position: relative; display: flex; align-items: center; justify-content: center; text-align: center; margin-bottom: 24px; }
    h1 { margin: 0; font-size: clamp(2.2rem, 9vw, 4rem); line-height: .95; letter-spacing: -.07em; }
    .game { padding: clamp(14px, 4vw, 26px); border: 3px solid #171717; border-radius: 18px; background: var(--panel); box-shadow: 7px 7px 0 #171717; }
    button { border: 0; color: inherit; font: inherit; cursor: pointer; }
    .settings { display: grid; gap: 10px; margin-bottom: 16px; }
    /* Die Einstellungen werden über das Zahnrad oben rechts geöffnet. */
    .settings-dialog { width: min(100% - 32px, 440px); max-width: none; padding: clamp(16px, 4vw, 24px); border: 3px solid #171717; border-radius: 18px; color: var(--text); background: var(--panel); box-shadow: 7px 7px 0 #171717; }
    .settings-dialog::backdrop { background: rgba(23,23,23,.45); }
    .settings-dialog h2 { margin: 0 0 14px; font-size: 1.4rem; letter-spacing: -.03em; outline: none; }
    /* Beim Öffnen bekommt die Überschrift den Fokus, damit kein Knopf hervorgehoben ist. */
    .settings-dialog .settings { margin-bottom: 18px; }
    .settings-done { display: block; width: 100%; padding: 11px; border: 3px solid #171717; border-radius: 10px; color: #FFFFFF; background: var(--red); font-weight: 800; box-shadow: 4px 4px 0 #171717; }
    .setting-row { display: grid; grid-template-columns: minmax(86px, .75fr) minmax(0, 1.25fr); align-items: center; gap: 8px; color: var(--muted); font-size: .82rem; }
    .setting-row.shape-row { grid-template-columns: 1fr; justify-items: start; }
    .setting-row.shape-row .shape-buttons { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
    .shape-buttons .setting-button { padding: 7px 4px; font-size: .7rem; white-space: normal; }
    .setting-row[hidden] { display: none; }
    .setting-buttons { display: flex; justify-content: flex-end; gap: 5px; }
    .setting-button { min-width: 0; padding: 7px 8px; border: 2px solid #171717; border-radius: 8px; color: var(--muted); background: #FFFFFF; font-size: .78rem; white-space: nowrap; }
    .setting-button.active { color: #FFFFFF; background: var(--red); }
    .mine-setting { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }
    .mine-setting input { width: 100%; min-width: 0; height: 24px; margin: 0; padding: 0; background: transparent; cursor: pointer; appearance: none; -webkit-appearance: none; }
    .mine-setting input::-webkit-slider-runnable-track { height: 7px; border: 1px solid #171717; border-radius: 999px; background: #D5D5D5; }
    .mine-setting input::-webkit-slider-thumb { width: 22px; height: 22px; margin-top: -8px; border: 3px solid #171717; border-radius: 50%; background: var(--red); -webkit-appearance: none; }
    .mine-setting input::-moz-range-track { height: 7px; border: 1px solid #171717; border-radius: 999px; background: #D5D5D5; }
    .mine-setting input::-moz-range-progress { height: 7px; border-radius: 999px; background: var(--red); }
    .mine-setting input::-moz-range-thumb { width: 16px; height: 16px; border: 3px solid #171717; border-radius: 50%; background: var(--red); }
    .mine-setting input:focus-visible { outline: 3px solid #171717; outline-offset: 3px; }
    .mine-setting output { min-width: 3.8em; color: var(--text); font-size: .78rem; font-weight: 800; text-align: right; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; text-align: center; }
    .stat { padding: 8px 3px; border: 2px solid #171717; border-radius: 10px; }
    .stat strong { display: block; font-size: 1.3rem; line-height: 1.1; }
    .stat span { color: var(--muted); font-size: .7rem; }
    .board-tools { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
    .hint-button { padding: 12px; border: 3px solid #171717; border-radius: 10px; font-weight: 800; box-shadow: 4px 4px 0 #171717; }
    .hint-button { background: #FFD166; white-space: nowrap; }
    .message { min-height: 27px; margin: 0 0 10px; color: var(--muted); text-align: center; font-size: .9rem; }
    .message b { color: var(--text); }
    .board { display: grid; gap: 2px; margin: 0 auto 18px; width: 100%; max-width: 540px; padding: 4px; border: 3px solid #171717; border-radius: 10px; background: #171717; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    /* Sechsecke: Spitze oben, ungerade Zeilen versetzt; Lage per JS in Prozent. Der leicht eingerückte Umriss lässt dunkle Fugen frei. */
    .board.hex { display: block; position: relative; padding: 0; }
    .board.hex .cell { position: absolute; aspect-ratio: auto; border-radius: 0; font-size: var(--cell-font-size, clamp(.9rem, 4.4vw, 1.4rem)); clip-path: polygon(50% 1.5%, 96.5% 25.8%, 96.5% 74.2%, 50% 98.5%, 3.5% 74.2%, 3.5% 25.8%); }
    .board.octagon { display: block; position: relative; padding: 0; }
    .board.octagon .cell { position: absolute; aspect-ratio: auto; border-radius: 0; }
    .board.octagon .cell.octagon { clip-path: polygon(calc(var(--cut, 29.289%) + .207px) .5px, calc(100% - var(--cut, 29.289%) - .207px) .5px, calc(100% - .5px) calc(var(--cut, 29.289%) + .207px), calc(100% - .5px) calc(100% - var(--cut, 29.289%) - .207px), calc(100% - var(--cut, 29.289%) - .207px) calc(100% - .5px), calc(var(--cut, 29.289%) + .207px) calc(100% - .5px), .5px calc(100% - var(--cut, 29.289%) - .207px), .5px calc(var(--cut, 29.289%) + .207px)); }
    .board.octagon .cell:not(.octagon) { clip-path: inset(.5px); }
    .board.hex .cell.wrong-flag { background: #FFD166; color: #EF4B3F; }
    .board.hex .cell:focus-visible { background: #FFD166; }
    /* Randlos: gestrichelter Rahmen, das Brett lässt sich ziehen statt die Seite zu scrollen. */
    .board.wrap { display: block; position: relative; padding: 0; overflow: hidden; border-style: dashed; touch-action: none; cursor: grab; }
    .board.wrap .cell { position: absolute; aspect-ratio: auto; will-change: left, top; }
    /* Fugen: Die Felder liegen auf ganzen Pixeln (layoutWrapped) und lassen rechts und unten genau 1 px frei,
       in dem der dunkle Hintergrund des Bretts zu sehen ist; gleich breit bei jedem Zoom. Ohne Eckenrundung,
       sonst entstehen an den Kreuzungen dunkle Punkte. */
    .board.wrap:not(.hex) .cell { border-radius: 0; clip-path: inset(0 1px 1px 0); }
    /* Quadrate zwischen Achtecken: ringsum 0,5 px, mit den 0,5 px der Achtecke überall 1 px Fuge. */
    .board.wrap.octagon .cell:not(.octagon) { clip-path: inset(.5px); }
    .board.wrap.octagon .cell.octagon { clip-path: polygon(calc(var(--cut, 29.289%) + .207px) .5px, calc(100% - var(--cut, 29.289%) - .207px) .5px, calc(100% - .5px) calc(var(--cut, 29.289%) + .207px), calc(100% - .5px) calc(100% - var(--cut, 29.289%) - .207px), calc(100% - var(--cut, 29.289%) - .207px) calc(100% - .5px), calc(var(--cut, 29.289%) + .207px) calc(100% - .5px), .5px calc(100% - var(--cut, 29.289%) - .207px), .5px calc(var(--cut, 29.289%) + .207px)); }
    .board.wrap .cell.wrong-flag { background: #FFD166; color: #EF4B3F; }
    .board.wrap.panning { cursor: grabbing; }
    .board.wrap .cell, .board.wrap.hex .cell { font-size: var(--cell-font-size, 1rem); }
    .board.wrap .cell.flag { font-size: var(--flag-font-size, 1.2rem); }
    /* Sechsecke: um 0,5 px senkrecht zu jeder Kante eingerückt, zusammen mit dem Nachbarn eine 1-px-Fuge.
       Bei einem regelmäßigen Sechseck mit Spitze oben liegen die Seiten bei 0,5 px, die Spitzen 0,5/cos 30° = 0,577 px
       und die Schrägecken 0,289 px weiter innen. */
    .board.wrap.hex .cell { clip-path: polygon(50% .577px, calc(100% - .5px) calc(25% + .289px), calc(100% - .5px) calc(75% - .289px), 50% calc(100% - .577px), .5px calc(75% - .289px), .5px calc(25% + .289px)); }
    .cell { position: relative; aspect-ratio: 1; min-width: 0; min-height: 0; overflow: hidden; padding: 0; border-radius: 3px; color: #171717; background: #4B8ED8; font-weight: 900; font-size: var(--cell-font-size, clamp(1rem, 5vw, 1.5rem)); line-height: 1; -webkit-tap-highlight-color: transparent; }
    .shovel-action { position: absolute; z-index: 2; top: 50%; left: 50%; display: grid; place-items: center; width: 84%; aspect-ratio: 1; background: transparent; transform: translate(-50%, -50%); }
    .shovel-action svg { display: block; width: 100%; height: 100%; }
    .cell.open { background: #FFFFFF; cursor: default; }
    @keyframes revealCell { from { opacity: .45; transform: scale(.72); } to { opacity: 1; transform: scale(1); } }
    .cell.opening { animation: revealCell .18s ease-out; }
    .cell.flag { background: #4B8ED8; font-size: var(--flag-font-size, clamp(1.2rem, 6vw, 1.7rem)); }
    .cell.mine { background: #EF4B3F; }
    .cell.wrong { background: #FFD166; }
    .cell.hint-safe, .cell.hint-mine { color: #FFFFFF; background: var(--bg); }
    .cell.wrong-flag { outline: 4px solid #EF4B3F; outline-offset: -5px; }
    .metal-detector { position: fixed; z-index: 1000; display: none; width: 46px; height: 46px; margin: -23px 0 0 -23px; pointer-events: none; filter: drop-shadow(2px 2px 1px rgba(0,0,0,.45)); transition: left .12s linear, top .12s linear; }
    .metal-detector.active { display: block; }
    .metal-detector svg { display: block; width: 100%; height: 100%; overflow: visible; }
    @keyframes flagWave { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
    .cell.flag.wave { animation: none; }
    .flag-icon { display: inline-block; transform-origin: 50% 100%; }
    .cell.flag.wave .flag-icon { animation: flagWave .45s ease-in-out 3; }
    .cell.n1 { color: #1f6fd0; } .cell.n2 { color: #2a9d4a; } .cell.n3 { color: #EF4B3F; } .cell.n4 { color: #6a3fc0; } .cell.n5 { color: #b5651d; } .cell.n6 { color: #14a0a0; } .cell.n7 { color: #171717; } .cell.n8 { color: #777; }
    .cell:focus-visible { outline: 3px solid #EF4B3F; outline-offset: -3px; }
    @media (prefers-reduced-motion: reduce) { .cell.flag.wave { animation: none; } .cell.opening { animation-duration: .01ms; } }
    @media (max-width: 600px) { .game.medium-mode .board, .game.hard-mode .board, .game.wrap-mode .board { width: calc(100% + 18px); max-width: none; margin-left: -9px; margin-right: -9px; } }
    @media (min-width: 768px) and (max-width: 1366px) and (orientation: landscape) { .app.tablet-wide { width: min(100%, 1100px); } .app.tablet-wide .board { max-width: 1040px; } }
    .app.tablet-wide .game.wrap-mode .board { max-width: 540px; }
    .new-game { display: block; width: 100%; padding: 12px; border: 3px solid #171717; border-radius: 10px; color: #FFFFFF; background: var(--red); font-weight: 800; box-shadow: 4px 4px 0 #171717; }
  </style>
</head>
<body class="board-view-mode">
  <main class="app">
    <header>
      <a class="back-button" href="index.html" aria-label="Zur Startseite" title="Zur Startseite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8"/></svg></a>
      <h1>Detektor</h1>
    </header>
    <section class="game" aria-label="Detektor-Spiel">
      <div class="stats" aria-label="Spielstatistik">
        <div class="stat"><strong id="mines">0</strong><span>Minen übrig</span></div>
        <div class="stat"><strong id="moves">0</strong><span>Felder offen</span></div>
        <div class="stat"><strong id="time">0:00</strong><span>Zeit</span></div>
        <p class="message" id="message" aria-live="polite"><b>Bereit?</b> Der erste Zug ist immer sicher.</p>
      </div>
      <div class="board" id="board" role="grid" aria-label="Minenfeld"></div>
      <div class="metal-detector" id="metalDetector" aria-hidden="true"><svg viewBox="0 0 64 64"><rect x="7" y="5" width="29" height="13" rx="4" fill="#EF4B3F" stroke="#171717" stroke-width="3"/><rect x="12" y="8" width="9" height="5" rx="1" fill="#FFFFFF"/><path d="M30 17 48 47" fill="none" stroke="#171717" stroke-width="6" stroke-linecap="round"/><path d="M31 19 46 44" fill="none" stroke="#4B8ED8" stroke-width="2"/><ellipse cx="49" cy="53" rx="12" ry="6" transform="rotate(-28 49 53)" fill="none" stroke="#171717" stroke-width="4"/></svg></div>
      <div class="board-tools">
        <button class="new-game" id="newGame" type="button">Neues Spiel</button>
        <button class="hint-button" id="hintButton" type="button">💡 Hinweis</button>
      </div>
      <button class="overlay-corner overlay-hint" id="overlayHint" type="button" aria-label="Hinweis anzeigen" title="Hinweis anzeigen">💡</button>
    </section>
    <dialog class="settings-dialog" id="settingsDialog" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle" tabindex="-1" autofocus>Neues Spiel</h2>
      <div class="settings" aria-label="Spielfeldeinstellungen">
        <div class="setting-row shape-row">
          <div class="setting-buttons shape-buttons" role="group" aria-label="Form der Felder">
            <button class="setting-button" data-shape="square" type="button">◼ Quadrate</button>
            <button class="setting-button" data-shape="hex" type="button">⬢ Sechsecke</button>
            <button class="setting-button" data-shape="octagon" type="button">⬡ Achtecke</button>
          </div>
        </div>
        <div class="setting-row" id="sizeButtonsRow">
          <span>Größe</span>
          <div class="setting-buttons" role="group" aria-label="Spielfeldgröße">
            <button class="setting-button" data-size="9x9" type="button">9×9</button>
            <button class="setting-button" data-size="12x12" type="button">12×12</button>
            <button class="setting-button" data-size="12x21" type="button">12×21</button>
          </div>
        </div>
        <div class="setting-row" id="wrapBoardSizeRow" hidden>
          <label for="wrapBoardSize">Spielfeldgröße</label>
          <div class="mine-setting">
            <input id="wrapBoardSize" type="range" min="14" max="30" step="4" value="14" aria-label="Spielfeldgröße auswählen" />
            <output id="wrapBoardSizeValue" for="wrapBoardSize">14×14</output>
          </div>
        </div>
        <div class="setting-row">
          <label for="mineCount">Minen</label>
          <div class="mine-setting">
            <input id="mineCount" type="range" min="10" max="50" step="10" value="20" aria-label="Anteil der Minen in Prozent" />
            <output id="mineCountValue" for="mineCount">Mittel</output>
          </div>
        </div>
      </div>
      <button class="settings-done" id="settingsDone" type="button">Spiel starten</button>
      <button class="version" data-version type="button" title="Klicken, um die Seite neu zu laden">Version 2.40</button>
    </dialog>
    <button class="version" data-version type="button" title="Klicken, um die Seite neu zu laden">Version 2.40</button>
    <script>document.querySelectorAll('[data-version]').forEach(versionButton => { versionButton.addEventListener('click', () => location.replace(`${location.pathname}?v=${Date.now()}`)); fetch(`VERSION?${Date.now()}`, { cache: 'no-store' }).then(response => response.text()).then(version => { versionButton.textContent = `Version ${version.trim()}`; }).catch(() => {}); });</script>
  </main>
  <script>
    const boardSizes = { '9x9': { cols: 9, rows: 9 }, '12x12': { cols: 12, rows: 12 }, '12x21': { cols: 12, rows: 21 } };
    function wrappedDimensions(size, shape) {
      let cols = size, rows = size;
      if (shape === 'hex' && rows % 2) rows++;
      if (shape === 'octagon') { if (cols % 2) cols++; if (rows % 2) rows++; }
      return { cols, rows };
    }
    // Es gibt nur noch den Randlos-Modus. Das Fenster zeigt 12 Spalten; wie viele Zeilen, richtet sich nach dem Platz

    mineCountInput.addEventListener('input', () => { mineCountOutput.value = mineTerm(Number(mineCountInput.value)); mineCountOutput.textContent = mineCountOutput.value; });
    mineCountInput.addEventListener('change', () => { minePercent = clamp(Math.round(Number(mineCountInput.value) / 10) * 10, MINE_PERCENT_MIN, MINE_PERCENT_MAX); refreshSettingsControls(); });
    // Drehen oder Fenstergröße ändern: Fenster neu einpassen, das Spiel läuft weiter.
    let fitFrame = 0;
    addEventListener('resize', () => { cancelAnimationFrame(fitFrame); fitFrame = requestAnimationFrame(fitAndLayout); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushGameState(); });
    addEventListener('pagehide', flushGameState);
    start(restoreGameState());
    // Beim ersten Aufbau stehen Schrift und Kopf noch nicht endgültig; nach dem Laden noch einmal einpassen.
    addEventListener('load', () => fitAndLayout());
  </script>
  <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
