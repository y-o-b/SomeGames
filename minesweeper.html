<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4B8ED8" />
  <meta name="description" content="Detektor: Finde Minen auf Quadraten oder Sechsecken, markiere falsche Flaggen und folge dem Metalldetektor." />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="application-name" content="Spiele" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Spiele" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="icon" href="icons/minesweeper.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/minesweeper-180.png" />
  <title>Detektor</title>
  <style>
    :root { --bg: #4B8ED8; --panel: #FFFFFF; --text: #171717; --muted: rgba(23,23,23,.7); --red: #EF4B3F; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px 15px; display: grid; justify-items: center; align-content: start; color: var(--text); background: var(--bg); font: 16px/1.5 Arial, Helvetica, sans-serif; }
    .app { width: min(100%, 620px); }
    .back-button { display: grid; place-items: center; width: 44px; height: 44px; position: absolute; left: 0; top: 50%; margin-top: -22px; border: 3px solid #171717; border-radius: 50%; color: #171717; background: #FFFFFF; box-shadow: 3px 3px 0 #171717; text-decoration: none; -webkit-tap-highlight-color: transparent; transition: transform .12s, box-shadow .12s; }
    .back-button svg { display: block; width: 24px; height: 24px; margin-right: 2px; fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    .back-button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #171717; }
    .back-button:focus-visible { outline: 3px solid #EF4B3F; outline-offset: 3px; }
    .version { display: block; margin: 14px auto 0; padding: 0; border: 0; color: var(--muted); background: transparent; font: inherit; font-size: .72rem; cursor: pointer; }
    header { position: relative; display: flex; align-items: center; justify-content: center; text-align: center; margin-bottom: 24px; }
    h1 { margin: 0; font-size: clamp(2.2rem, 9vw, 4rem); line-height: .95; letter-spacing: -.07em; }
    .game { padding: clamp(14px, 4vw, 26px); border: 3px solid #171717; border-radius: 18px; background: var(--panel); box-shadow: 7px 7px 0 #171717; }
    button { border: 0; color: inherit; font: inherit; cursor: pointer; }
    .settings { display: grid; gap: 10px; margin-bottom: 16px; }
    /* Die Einstellungen werden über das Zahnrad oben rechts geöffnet. */
    .settings-open { display: grid; place-items: center; width: 44px; height: 44px; position: absolute; right: 0; top: 50%; margin-top: -22px; padding: 0; border: 3px solid #171717; border-radius: 50%; color: #171717; background: #FFFFFF; box-shadow: 3px 3px 0 #171717; -webkit-tap-highlight-color: transparent; transition: transform .12s, box-shadow .12s; }
    .settings-open svg { display: block; width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .settings-open:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #171717; }
    .settings-open:focus-visible { outline: 3px solid #EF4B3F; outline-offset: 3px; }
    .settings-dialog { width: min(100% - 32px, 440px); max-width: none; padding: clamp(16px, 4vw, 24px); border: 3px solid #171717; border-radius: 18px; color: var(--text); background: var(--panel); box-shadow: 7px 7px 0 #171717; }
    .settings-dialog::backdrop { background: rgba(23,23,23,.45); }
    .settings-dialog h2 { margin: 0 0 14px; font-size: 1.4rem; letter-spacing: -.03em; outline: none; }
    /* Beim Öffnen bekommt die Überschrift den Fokus, damit kein Knopf hervorgehoben ist. */
    .settings-dialog .settings { margin-bottom: 18px; }
    .settings-done { display: block; width: 100%; padding: 11px; border: 3px solid #171717; border-radius: 10px; color: #FFFFFF; background: var(--red); font-weight: 800; box-shadow: 4px 4px 0 #171717; }
    .setting-row { display: grid; grid-template-columns: minmax(86px, .75fr) minmax(0, 1.25fr); align-items: center; gap: 8px; color: var(--muted); font-size: .82rem; }
    .setting-row[hidden] { display: none; }
    .setting-buttons { display: flex; justify-content: flex-end; gap: 5px; }
    .setting-button { min-width: 0; padding: 7px 8px; border: 2px solid #171717; border-radius: 8px; color: var(--muted); background: #FFFFFF; font-size: .78rem; white-space: nowrap; }
    .setting-button.active { color: #FFFFFF; background: var(--red); }
    .mine-setting { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }
    .mine-setting input { width: 100%; min-width: 0; height: 24px; margin: 0; padding: 0; background: transparent; cursor: pointer; appearance: none; -webkit-appearance: none; }
    .mine-setting input::-webkit-slider-runnable-track { height: 7px; border: 1px solid #171717; border-radius: 999px; background: #D5D5D5; }
    .mine-setting input::-webkit-slider-thumb { width: 22px; height: 22px; margin-top: -8px; border: 3px solid #171717; border-radius: 50%; background: var(--red); -webkit-appearance: none; }
    .mine-setting input::-moz-range-track { height: 7px; border: 1px solid #171717; border-radius: 999px; background: #D5D5D5; }
    .mine-setting input::-moz-range-progress { height: 7px; border-radius: 999px; background: var(--red); }
    .mine-setting input::-moz-range-thumb { width: 16px; height: 16px; border: 3px solid #171717; border-radius: 50%; background: var(--red); }
    .mine-setting input:focus-visible { outline: 3px solid #171717; outline-offset: 3px; }
    .mine-setting output { min-width: 3.8em; color: var(--text); font-size: .78rem; font-weight: 800; text-align: right; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; text-align: center; }
    .stat { padding: 8px 3px; border: 2px solid #171717; border-radius: 10px; }
    .stat strong { display: block; font-size: 1.3rem; line-height: 1.1; }
    .stat span { color: var(--muted); font-size: .7rem; }
    .board-tools { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
    .hint-button { padding: 12px; border: 3px solid #171717; border-radius: 10px; font-weight: 800; box-shadow: 4px 4px 0 #171717; }
    .hint-button { background: #FFD166; white-space: nowrap; }
    .message { min-height: 27px; margin: 0 0 10px; color: var(--muted); text-align: center; font-size: .9rem; }
    .message b { color: var(--text); }
    .board { display: grid; gap: 2px; margin: 0 auto 18px; width: 100%; max-width: 540px; padding: 4px; border: 3px solid #171717; border-radius: 10px; background: #171717; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    /* Sechsecke: Spitze oben, ungerade Zeilen versetzt; Lage per JS in Prozent. Der leicht eingerückte Umriss lässt dunkle Fugen frei. */
    .board.hex { display: block; position: relative; padding: 0; }
    .board.hex .cell { position: absolute; aspect-ratio: auto; border-radius: 0; font-size: clamp(.9rem, 4.4vw, 1.4rem); clip-path: polygon(50% 1.5%, 96.5% 25.8%, 96.5% 74.2%, 50% 98.5%, 3.5% 74.2%, 3.5% 25.8%); }
    .board.hex .cell.wrong-flag { background: #FFD166; color: #EF4B3F; }
    .board.hex .cell:focus-visible { background: #FFD166; }
    /* Randlos: gestrichelter Rahmen, das Brett lässt sich ziehen statt die Seite zu scrollen. */
    .board.wrap { display: block; position: relative; padding: 0; overflow: hidden; border-style: dashed; touch-action: none; cursor: grab; }
    .board.wrap .cell { position: absolute; aspect-ratio: auto; will-change: left, top; }
    /* Fugen: Die Felder liegen auf ganzen Pixeln (layoutWrapped) und lassen rechts und unten genau 1 px frei,
       in dem der dunkle Hintergrund des Bretts zu sehen ist; gleich breit bei jedem Zoom. Ohne Eckenrundung,
       sonst entstehen an den Kreuzungen dunkle Punkte. */
    .board.wrap:not(.hex) .cell { border-radius: 0; clip-path: inset(0 1px 1px 0); }
    .board.wrap .cell.wrong-flag { background: #FFD166; color: #EF4B3F; }
    .board.wrap.panning { cursor: grabbing; }
    .board.wrap .cell { font-size: calc(clamp(1rem, 5vw, 1.5rem) * var(--zoom, 1)); }
    .board.wrap .cell.flag { font-size: calc(clamp(1.2rem, 6vw, 1.7rem) * var(--zoom, 1)); }
    .board.wrap.hex .cell { font-size: calc(clamp(.9rem, 4.4vw, 1.4rem) * var(--zoom, 1)); }
    /* Sechsecke: um 0,5 px senkrecht zu jeder Kante eingerückt, zusammen mit dem Nachbarn eine 1-px-Fuge.
       Bei einem regelmäßigen Sechseck mit Spitze oben liegen die Seiten bei 0,5 px, die Spitzen 0,5/cos 30° = 0,577 px
       und die Schrägecken 0,289 px weiter innen. */
    .board.wrap.hex .cell { clip-path: polygon(50% .577px, calc(100% - .5px) calc(25% + .289px), calc(100% - .5px) calc(75% - .289px), 50% calc(100% - .577px), .5px calc(75% - .289px), .5px calc(25% + .289px)); }
    .cell { position: relative; aspect-ratio: 1; min-width: 0; min-height: 0; overflow: hidden; padding: 0; border-radius: 3px; color: #171717; background: #4B8ED8; font-weight: 900; font-size: clamp(1rem, 5vw, 1.5rem); line-height: 1; -webkit-tap-highlight-color: transparent; }
    .shovel-action { position: absolute; z-index: 2; top: 50%; left: 50%; display: grid; place-items: center; width: 84%; aspect-ratio: 1; background: transparent; transform: translate(-50%, -50%); }
    .shovel-action svg { display: block; width: 100%; height: 100%; }
    .cell.open { background: #FFFFFF; cursor: default; }
    @keyframes revealCell { from { opacity: .45; transform: scale(.72); } to { opacity: 1; transform: scale(1); } }
    .cell.opening { animation: revealCell .18s ease-out; }
    .cell.flag { background: #4B8ED8; font-size: clamp(1.2rem, 6vw, 1.7rem); }
    .cell.mine { background: #EF4B3F; }
    .cell.wrong { background: #FFD166; }
    .cell.hint-safe, .cell.hint-mine { color: #FFFFFF; background: var(--bg); }
    .cell.wrong-flag { outline: 4px solid #EF4B3F; outline-offset: -5px; }
    .metal-detector { position: fixed; z-index: 1000; display: none; width: 46px; height: 46px; margin: -23px 0 0 -23px; pointer-events: none; filter: drop-shadow(2px 2px 1px rgba(0,0,0,.45)); transition: left .12s linear, top .12s linear; }
    .metal-detector.active { display: block; }
    .metal-detector svg { display: block; width: 100%; height: 100%; overflow: visible; }
    @keyframes flagWave { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
    .cell.flag.wave { animation: none; }
    .flag-icon { display: inline-block; transform-origin: 50% 100%; }
    .cell.flag.wave .flag-icon { animation: flagWave .45s ease-in-out 3; }
    .cell.n1 { color: #1f6fd0; } .cell.n2 { color: #2a9d4a; } .cell.n3 { color: #EF4B3F; } .cell.n4 { color: #6a3fc0; } .cell.n5 { color: #b5651d; } .cell.n6 { color: #14a0a0; } .cell.n7 { color: #171717; } .cell.n8 { color: #777; }
    .cell:focus-visible { outline: 3px solid #EF4B3F; outline-offset: -3px; }
    @media (prefers-reduced-motion: reduce) { .cell.flag.wave { animation: none; } .cell.opening { animation-duration: .01ms; } }
    @media (max-width: 600px) { .game.medium-mode .board, .game.hard-mode .board, .game.wrap-mode .board { width: calc(100% + 18px); max-width: none; margin-left: -9px; margin-right: -9px; } }
    @media (min-width: 768px) and (max-width: 1366px) and (orientation: landscape) { .app.tablet-wide { width: min(100%, 1100px); } .app.tablet-wide .board { max-width: 1040px; } }
    .app.tablet-wide .game.wrap-mode .board { max-width: 540px; }
    .new-game { display: block; width: 100%; padding: 12px; border: 3px solid #171717; border-radius: 10px; color: #FFFFFF; background: var(--red); font-weight: 800; box-shadow: 4px 4px 0 #171717; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <a class="back-button" href="index.html" aria-label="Zur Startseite" title="Zur Startseite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8"/></svg></a>
      <h1>Detektor</h1>
      <button class="settings-open" id="settingsOpen" type="button" aria-label="Einstellungen" title="Einstellungen" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/><circle cx="12" cy="12" r="6.6"/></svg></button>
    </header>
    <section class="game" aria-label="Detektor-Spiel">
      <div class="stats" aria-label="Spielstatistik">
        <div class="stat"><strong id="mines">0</strong><span>Minen übrig</span></div>
        <div class="stat"><strong id="moves">0</strong><span>Felder offen</span></div>
        <div class="stat"><strong id="time">0:00</strong><span>Zeit</span></div>
      </div>
      <p class="message" id="message" aria-live="polite"><b>Bereit?</b> Der erste Zug ist immer sicher.</p>
      <div class="board" id="board" role="grid" aria-label="Minenfeld"></div>
      <div class="metal-detector" id="metalDetector" aria-hidden="true"><svg viewBox="0 0 64 64"><rect x="7" y="5" width="29" height="13" rx="4" fill="#EF4B3F" stroke="#171717" stroke-width="3"/><rect x="12" y="8" width="9" height="5" rx="1" fill="#FFFFFF"/><path d="M30 17 48 47" fill="none" stroke="#171717" stroke-width="6" stroke-linecap="round"/><path d="M31 19 46 44" fill="none" stroke="#4B8ED8" stroke-width="2"/><ellipse cx="49" cy="53" rx="12" ry="6" transform="rotate(-28 49 53)" fill="none" stroke="#171717" stroke-width="4"/></svg></div>
      <div class="board-tools">
        <button class="new-game" id="newGame" type="button">Neues Spiel</button>
        <button class="hint-button" id="hintButton" type="button">💡 Hinweis</button>
      </div>
    </section>
    <dialog class="settings-dialog" id="settingsDialog" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle" tabindex="-1" autofocus>Einstellungen</h2>
      <div class="settings" aria-label="Spielfeldeinstellungen">
        <div class="setting-row">
          <span>Felder</span>
          <div class="setting-buttons" role="group" aria-label="Form der Felder">
            <button class="setting-button" data-shape="square" type="button">◼ Quadrate</button>
            <button class="setting-button" data-shape="hex" type="button">⬢ Sechsecke</button>
          </div>
        </div>
        <div class="setting-row" id="sizeButtonsRow">
          <span>Größe</span>
          <div class="setting-buttons" role="group" aria-label="Spielfeldgröße">
            <button class="setting-button" data-size="9x9" type="button">9×9</button>
            <button class="setting-button" data-size="12x12" type="button">12×12</button>
            <button class="setting-button" data-size="12x21" type="button">12×21</button>
          </div>
        </div>
        <div class="setting-row" id="wrapBoardSizeRow" hidden>
          <label for="wrapBoardSize">Spielfeldgröße</label>
          <div class="mine-setting">
            <input id="wrapBoardSize" type="range" min="9" max="25" step="1" value="9" aria-label="Spielfeldgröße auswählen" />
            <output id="wrapBoardSizeValue" for="wrapBoardSize">9×9</output>
          </div>
        </div>
        <div class="setting-row">
          <label for="mineCount">Anzahl Minen</label>
          <div class="mine-setting">
            <input id="mineCount" type="range" min="1" max="28" value="10" />
            <output id="mineCountValue" for="mineCount">10 / 28</output>
          </div>
        </div>
      </div>
      <button class="settings-done" id="settingsDone" type="button">Fertig</button>
    </dialog>
    <button class="version" data-version type="button" title="Klicken, um die Seite neu zu laden">Version 1.77</button>
    <script>const versionButton = document.querySelector('[data-version]'); versionButton.addEventListener('click', () => location.replace(`${location.pathname}?v=${Date.now()}`)); fetch(`VERSION?${Date.now()}`, { cache: 'no-store' }).then(response => response.text()).then(version => { versionButton.textContent = `Version ${version.trim()}`; }).catch(() => {});</script>
  </main>
  <script>
    const boardSizes = { '9x9': { cols: 9, rows: 9 }, '12x12': { cols: 12, rows: 12 }, '12x21': { cols: 12, rows: 21 } };
    // Es gibt nur noch den Randlos-Modus. Das Fenster zeigt 12 Spalten; wie viele Zeilen, richtet sich nach dem Platz
    // auf dem Bildschirm (fitWrapWindow), höchstens WRAP_VIEW_ROWS_MAX.
    const WRAP_BOARD_MIN = 9, WRAP_BOARD_MAX = 25, WRAP_VIEW_COLS = 12, WRAP_VIEW_ROWS_MAX = 30, ZOOM_MIN = .75, ZOOM_MAX = 2;
    let wrapZoom = 1, zoomTimer = null, pinch = null, wrapViewRows = 18;
    const activePointers = new Map();
    const viewCols = () => WRAP_VIEW_COLS / wrapZoom, viewRows = () => wrapViewRows / wrapZoom;
    const boardElement = document.getElementById('board'), message = document.getElementById('message'), gamePanel = document.querySelector('.game'), appElement = document.querySelector('.app'), detectorElement = document.getElementById('metalDetector');
    const mineCountInput = document.getElementById('mineCount'), mineCountOutput = document.getElementById('mineCountValue'), wrapBoardSizeInput = document.getElementById('wrapBoardSize'), wrapBoardSizeOutput = document.getElementById('wrapBoardSizeValue'), wrapBoardSizeRow = document.getElementById('wrapBoardSizeRow'), sizeButtonsRow = document.getElementById('sizeButtonsRow');
    const SHAPE_STORAGE_KEY = 'y-o-b.minesweeper.shape.v1', WRAP_STORAGE_KEY = 'y-o-b.minesweeper.wrap.v1', WRAP_BOARD_SIZE_KEY = 'y-o-b.minesweeper.wrap-board-size.v1', SIZE_STORAGE_KEY = 'y-o-b.minesweeper.size.v1', MINE_COUNT_STORAGE_KEY = 'y-o-b.minesweeper.mine-count.v1', LEVEL_STORAGE_KEY = 'y-o-b.minesweeper.level.v1', GAME_STATE_KEY = 'y-o-b.minesweeper.game.v1';
    let boardShape = 'square', boardWrap = true, wrapBoardSize = 9, offsetX = 0, offsetY = 0, pan = null, panEndedAt = 0, panFrame = 0, ghosts = [], boardSize = '9x9', mineCount = 10, activeConfig = null, grid = [], over = false, placed = false, seconds = 0, timer = null, openCount = 0, flagCount = 0, pressTimer = null, longPressed = false, autoSafeTimer = null, revealTimers = [], revealing = false, detectorTimers = [], detectorRun = 0, shovelIndex = null, gameSaveTimer = null;
    function maxMineCount(size) { return boardWrap ? Math.min(300, Math.max(60, Math.floor(wrapBoardSize * wrapBoardSize * .5))) : ({ '9x9': 60, '12x12': 80, '12x21': 120 })[size]; }
    try {
      const savedSize = localStorage.getItem(SIZE_STORAGE_KEY), savedMineCount = localStorage.getItem(MINE_COUNT_STORAGE_KEY), savedWrapBoardSize = Number(localStorage.getItem(WRAP_BOARD_SIZE_KEY));
      const validSavedMineCount = Number.isInteger(Number(savedMineCount)) && Number(savedMineCount) > 0;
      if (boardSizes[savedSize]) boardSize = savedSize;
      if (['square', 'hex'].includes(localStorage.getItem(SHAPE_STORAGE_KEY))) boardShape = localStorage.getItem(SHAPE_STORAGE_KEY);
      if (validSavedMineCount) mineCount = Number(savedMineCount);
      const legacyPresets = { easy: ['9x9', 10], medium: ['12x12', 25], hard: ['12x21', 40] }, legacy = legacyPresets[localStorage.getItem(LEVEL_STORAGE_KEY)];
      if (legacy) { if (!boardSizes[savedSize]) boardSize = legacy[0]; if (!validSavedMineCount) mineCount = legacy[1]; }
      const preset = boardSizes[boardSize], presetWrapSize = Math.max(preset.cols, preset.rows);
      wrapBoardSize = Number.isInteger(savedWrapBoardSize) && savedWrapBoardSize >= WRAP_BOARD_MIN && savedWrapBoardSize <= WRAP_BOARD_MAX ? savedWrapBoardSize : presetWrapSize;
    } catch (error) { console.warn('Detektor-Einstellungen konnten nicht geladen werden.', error); }
    mineCount = Math.min(mineCount, maxMineCount(boardSize));
    document.querySelectorAll('[data-size]').forEach(button => button.classList.toggle('active', button.dataset.size === boardSize));
    document.querySelectorAll('[data-shape]').forEach(button => button.classList.toggle('active', button.dataset.shape === boardShape));
    document.querySelectorAll('[data-wrap]').forEach(button => button.classList.toggle('active', (button.dataset.wrap === 'on') === boardWrap));
    function updateMineControl() { const max = maxMineCount(boardSize); mineCount = Math.min(mineCount, max); mineCountInput.max = max; mineCountInput.value = mineCount; mineCountOutput.value = `${mineCount} / ${max}`; mineCountOutput.textContent = `${mineCount} / ${max}`; }
    updateMineControl();
    const tabletLandscape = () => matchMedia('(min-width: 768px) and (max-width: 1366px) and (orientation: landscape)').matches;
    function boardSizeLabel(size, landscape = tabletLandscape()) { const { cols, rows } = boardSizes[size]; return size === '12x21' && landscape ? `${rows}×${cols}` : `${cols}×${rows}`; }
    function selectedConfig() {
      const size = boardSizes[boardSize], rotate = !boardWrap && boardSize === '12x21' && tabletLandscape();
      const cols = boardWrap ? wrapBoardSize : rotate ? size.rows : size.cols;
      let rows = boardWrap ? wrapBoardSize : rotate ? size.cols : size.rows;
      if (boardShape === 'hex' && boardWrap && rows % 2) rows++;
      return { cols, rows, mines: mineCount, shape: boardShape, wrap: boardWrap };
    }
    const config = () => activeConfig || selectedConfig();
    function updateSizeButtons() {
      const landscape = activeConfig ? activeConfig.cols > activeConfig.rows : tabletLandscape();
      document.querySelectorAll('[data-size]').forEach(button => { button.textContent = boardSizeLabel(button.dataset.size, landscape); button.classList.toggle('active', button.dataset.size === boardSize); });
    }
    function updateWrapBoardSizeControl() { sizeButtonsRow.hidden = boardWrap; wrapBoardSizeRow.hidden = !boardWrap; const label = `${wrapBoardSize}×${wrapBoardSize}`; wrapBoardSizeInput.value = wrapBoardSize; wrapBoardSizeOutput.value = label; wrapBoardSizeOutput.textContent = label; }
    updateSizeButtons();
    const settingsDialog = document.getElementById('settingsDialog');
    const openSettings = () => { if (!settingsDialog.open) settingsDialog.showModal(); };
    document.getElementById('settingsOpen').addEventListener('click', openSettings);
    document.getElementById('settingsDone').addEventListener('click', () => settingsDialog.close());
    // Ein Tipp neben das Popup schließt es ebenfalls.
    settingsDialog.addEventListener('click', event => { if (event.target === settingsDialog) settingsDialog.close(); });

      sequence.forEach((current, step) => revealTimers.push(setTimeout(() => {
        const cell = grid[current]; if (over || !cell || cell.open) return;
        cell.open = true; cell.opening = true; openCount++; draw(current); updateStats();
        if (step === sequence.length - 1) { revealTimers = []; revealing = false; updateGuessMarks(); updateStats(); if (openCount === grid.length - config().mines) win(); }
      }, step * delay)));
    }
    function finish() { over = true; revealing = false; revealTimers.forEach(clearTimeout); revealTimers = []; clearInterval(timer); grid.forEach((_, index) => draw(index)); persistGameState(); }
    function lose(index) { finish(); boardElement.children[index].classList.add('mine'); syncGhosts(index); message.innerHTML = '<b>Boom!</b> Eine Mine wurde ausgelöst. Versuche es noch einmal.'; }
    function win() { grid.forEach(cell => { if (cell.mine) cell.flag = true; }); flagCount = config().mines; finish(); updateStats(); boardElement.querySelectorAll('.cell.flag').forEach((cell, index) => { cell.style.animationDelay = `${index * 35}ms`; cell.classList.add('wave'); }); message.innerHTML = `<b>Gewonnen!</b> Alle Minen gefunden in ${document.getElementById('time').textContent}.`; }
    document.getElementById('hintButton').addEventListener('click', showHint);
    // Zoom (nur randlos): Das Fenster bleibt 12×24, sichtbar sind 12/Zoom × 24/Zoom Felder; die Mitte bleibt stehen.
    function applyZoomStyles() {
      boardElement.style.setProperty('--zoom', wrapZoom);
    }
    function setZoom(value) {
      const next = Math.round(Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, value)) * 100) / 100;
      if (!config().wrap || next === wrapZoom) return;
      const oldCols = viewCols(), oldRows = viewRows(), stepY = config().shape === 'hex' ? .75 * 2 / Math.sqrt(3) : 1;
      wrapZoom = next; offsetX += (viewCols() - oldCols) / 2; offsetY += (viewRows() - oldRows) * stepY / 2;
      applyZoomStyles(); layoutCells();
      persistGameState();
      clearTimeout(autoSafeTimer); autoSafeTimer = null; stopDetector(); clearShovel();
      clearTimeout(zoomTimer); zoomTimer = setTimeout(() => { zoomTimer = null; if (!over && !revealing) updateGuessMarks(); }, 300);
    }
    // Verschieben im Randlos-Modus: erst ab 12 px Bewegung, stufenlos; mit zwei Fingern wird gezoomt.
    boardElement.addEventListener('pointerdown', event => {
      if (!config().wrap || event.button > 0) return;
      activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (activePointers.size === 2) {
        const [a, b] = [...activePointers.values()];
        pinch = { distance: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), zoom: wrapZoom };
        pan = null; clearTimeout(pressTimer); pressTimer = null; longPressed = false; clearShovel(); boardElement.classList.remove('panning');
        return;
      }
      if (activePointers.size === 1) pan = { id: event.pointerId, x: event.clientX, y: event.clientY, offsetX, offsetY, active: false };
    });
    boardElement.addEventListener('pointermove', event => {
      if (activePointers.has(event.pointerId)) activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (pinch) {
        if (activePointers.size < 2) return;
        const [a, b] = [...activePointers.values()];
        panEndedAt = Date.now(); setZoom(pinch.zoom * Math.hypot(a.x - b.x, a.y - b.y) / pinch.distance);
        return;
      }
      if (!pan || event.pointerId !== pan.id) return;
      const dx = event.clientX - pan.x, dy = event.clientY - pan.y;
      if (!pan.active) { if (Math.hypot(dx, dy) < 12) return; pan.active = true; clearTimeout(pressTimer); pressTimer = null; clearTimeout(autoSafeTimer); autoSafeTimer = null; stopDetector(); clearShovel(); boardElement.classList.add('panning'); try { boardElement.setPointerCapture(pan.id); } catch (error) {} }
      // Stufenlos: eine Feldbreite entspricht boardElement.clientWidth / viewCols(); einmal je Bild neu zeichnen.
      const unit = boardElement.clientWidth / viewCols();
      offsetX = pan.offsetX + dx / unit; offsetY = pan.offsetY + dy / unit;
      if (!panFrame) panFrame = requestAnimationFrame(() => { panFrame = 0; layoutCells(); });
    });
    ['pointerup', 'pointercancel'].forEach(type => boardElement.addEventListener(type, event => {
      activePointers.delete(event.pointerId);
      if (pinch) { if (activePointers.size < 2) { pinch = null; pan = null; panEndedAt = Date.now(); boardElement.classList.remove('panning'); persistGameState(); } return; }
      if (!pan || event.pointerId !== pan.id) return; const wasPanning = pan.active; if (wasPanning) { panEndedAt = Date.now(); boardElement.classList.remove('panning'); persistGameState(); } pan = null; if (wasPanning && !over && !revealing) requestAnimationFrame(() => requestAnimationFrame(() => { if (!over && !revealing && !pan?.active) updateGuessMarks(); }));
    }));
    document.querySelectorAll('[data-wrap]').forEach(button => button.addEventListener('click', () => { boardWrap = button.dataset.wrap === 'on'; updateMineControl(); saveSettings(); document.querySelectorAll('[data-wrap]').forEach(item => item.classList.toggle('active', item === button)); start(); }));
    wrapBoardSizeInput.addEventListener('input', () => { const size = Number(wrapBoardSizeInput.value); wrapBoardSizeOutput.value = `${size}×${size}`; wrapBoardSizeOutput.textContent = wrapBoardSizeOutput.value; });
    wrapBoardSizeInput.addEventListener('change', () => { const size = Number(wrapBoardSizeInput.value); if (!Number.isInteger(size) || size < WRAP_BOARD_MIN || size > WRAP_BOARD_MAX || size === wrapBoardSize) return; wrapBoardSize = size; updateMineControl(); saveSettings(); start(); });
    document.querySelectorAll('[data-shape]').forEach(button => button.addEventListener('click', () => { boardShape = button.dataset.shape; saveSettings(); document.querySelectorAll('[data-shape]').forEach(item => item.classList.toggle('active', item === button)); start(); }));
    document.querySelectorAll('[data-size]').forEach(button => button.addEventListener('click', () => { boardSize = button.dataset.size; updateMineControl(); saveSettings(); document.querySelectorAll('[data-size]').forEach(item => item.classList.toggle('active', item === button)); start(); }));
    mineCountInput.addEventListener('input', () => { mineCountOutput.value = `${mineCountInput.value} / ${mineCountInput.max}`; mineCountOutput.textContent = mineCountOutput.value; });
    mineCountInput.addEventListener('change', () => { mineCount = Number(mineCountInput.value); updateMineControl(); saveSettings(); start(); });
    // Drehen oder Fenstergröße ändern: Fenster neu einpassen, das Spiel läuft weiter.
    let fitFrame = 0;
    addEventListener('resize', () => { cancelAnimationFrame(fitFrame); fitFrame = requestAnimationFrame(fitAndLayout); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushGameState(); });
    addEventListener('pagehide', flushGameState);
    document.getElementById('newGame').addEventListener('click', () => start()); start(restoreGameState());
    // Beim ersten Aufbau stehen Schrift und Kopf noch nicht endgültig; nach dem Laden noch einmal einpassen.
    addEventListener('load', () => fitAndLayout());
  </script>
  <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
